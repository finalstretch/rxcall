<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- the capsule outline, used to clip the coloured half -->
    <clipPath id="cap"><rect x="-150" y="-370" width="300" height="740" rx="150"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- capsule -->
  <g transform="translate(490,540) rotate(-40)" filter="url(#shadow)">
    <rect x="-150" y="-370" width="300" height="740" rx="150" fill="#ffffff"/>
    <g clip-path="url(#cap)">
      <rect x="-150" y="0" width="300" height="370" fill="url(#amber)"/>
      <rect x="-150" y="-7" width="300" height="14" fill="#0f766e" opacity=".35"/>
      <!-- soft highlight along the top edge -->
      <rect x="-118" y="-330" width="36" height="290" rx="18" fill="#ffffff" opacity=".55"/>
      <rect x="-118" y="40" width="36" height="290" rx="18" fill="#ffffff" opacity=".35"/>
    </g>
  </g>

  <!-- alert badge -->
  <g filter="url(#shadow)">
    <circle cx="784" cy="240" r="128" fill="#f43f5e"/>
  </g>
  <rect x="762" y="160" width="44" height="96" rx="22" fill="#ffffff"/>
  <circle cx="784" cy="300" r="24" fill="#ffffff"/>
</svg>
